# Matches Hermes' own ruff setup (Black-style, 88 columns, py311 floor).
line-length = 88
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vega's text uses "·" and "…" on purpose

[lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
