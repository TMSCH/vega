# Vega's own settings. Copy this file to `vega.toml` in Vega's Hermes profile
# (scripts/install.sh does it for you) and fill in the allowlist there.
# `vega.toml` is never committed: it holds your workspace's Slack ids.
#
# Lookup order: `vega --config PATH`, then $VEGA_CONFIG, then
# `$HERMES_HOME/vega.toml` (Vega's profile home), then
# `~/.hermes/profiles/vega/vega.toml`. A missing file refuses everyone.

[access]
# Slack member ids (U… or W…) allowed to talk to Vega. Find one in Slack:
# profile -> ⋮ -> Copy member ID. Empty means nobody.
users = []
# Channel ids (C… public, G… private or group DM) where Vega answers @mentions.
# 1:1 DMs from allowlisted users are always accepted. ["*"] means any channel
# Vega has been invited to (Slack only delivers those), still only from the
# users above.
channels = []
# What anyone else is told, once per ten minutes at most. Nothing is relayed.
# refusal = "Sorry, I only take requests from people and channels on my allowlist. Ask the fleet operator to add you if you need access."

[mission_control]
# Vega delivers to the one live thurbox session whose name contains this text
# (case-insensitive). Session names carry a glyph, so they are matched, never typed.
# lead_match = "Mission Control"
# Posted in the Slack thread once a message is relayed.
# ack = "Passed to Mission Control. It will answer in this thread."
# Posted instead when the thread has a task with a live session and the message went
# straight to that session. {task} is the task's ref.
# task_ack = "Passed to the session working on {task}. It will answer in this thread."
# Append "(answer in Slack with: vega reply <channel>/<ts> …)" to every relayed
# line, so Mission Control knows how to answer without any standing instruction.
# reply_hint = true

[fleet]
# The fleet checkout whose read-only commands answer status questions
# (`fleet status`, `fleet queue list --live`, `fleet context`) and which Vega asks
# (`fleet queue find --origin slack:<channel>/<thread_ts> --json`) whether a Slack
# thread has a task with a live session to route its replies to.
# project = "~/fleet"

[slack]
# The Hermes profile holding Vega's Slack tokens; `vega reply` posts through it.
# hermes_profile = "vega"

[runtime]
# Where long inbound messages are written for Mission Control to read.
# dir = "~/.local/state/vega"
# Messages longer than this, or with line breaks, go to a file instead of inline.
# max_inline_chars = 400
# true makes `vega reply` print instead of posting, as if --dry-run were passed.
# dry_run = false

[status]
# Regexes (matched against the lower-cased message) that mark a status question,
# which Vega answers itself from fleet's read-only views without waking the lead.
# Everything else is relayed to Mission Control.
# patterns = ["\\bwhat'?s (running|in flight|going on|happening)\\b", "^\\s*status\\??\\s*$"]
