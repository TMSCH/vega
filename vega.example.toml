# Vega's own settings. Copy this file to `vega.toml` in Vega's Hermes profile
# (scripts/install.sh does it for you) and fill in the allowlist there.
# `vega.toml` is never committed: it holds your workspace's Slack ids and paths.
#
# Lookup order: `vega --config PATH`, then $VEGA_CONFIG, then
# `$HERMES_HOME/vega.toml` (Vega's profile home), then
# `~/.hermes/profiles/vega/vega.toml`. A missing file refuses everyone.
# Only the tables and keys below exist: any other table or key is an error, so
# a typo cannot silently leave the allowlist empty.

[access]
# Slack member ids (U… or W…) allowed to talk to Vega. Find one in Slack:
# profile -> ⋮ -> Copy member ID. Empty means nobody.
users = []
# Channel ids (C… public, G… private or group DM) where Vega answers @mentions.
# 1:1 DMs from allowlisted users are always accepted. ["*"] means any channel
# Vega has been invited to (Slack only delivers those), still only from the
# users above.
channels = []
# What anyone else is told, once per ten minutes at most.
# refusal = "Sorry, I only take requests from people and channels on my allowlist. Ask the fleet operator to add you if you need access."

[fleet]
# The fleet checkout (the control plane) every fleet command runs against, as
# `uv run --project <project> fleet …`.
# project = "~/fleet"
# Repositories a Slack thread may open a task in. A task naming any other path
# is refused before fleet is asked. Empty means no task can be added.
# repos = ["~/app", "~/web"]
# fleet-intake's rule: an origin dispatches only when fuel reads at least
# reserve + this margin, fresh, on every gated account. Below that the tasks
# stay queued for the conductor.
# fuel_margin = 10
# Which accounts the gate reads, by provider name as `fleet status --fuel`
# prints them. Empty means the first account printed, the checkout's own.
# fuel_providers = []

[origin]
# How often a thread with open tasks checks fleet's records and posts news
# (shipped, landed, abandoned, a worker's question). At least 60s.
# heartbeat_interval = "5m"
# How many times per hour a thread may answer one worker with `fleet queue send`.
# max_sends_per_hour = 6
# The largest brief a thread may write for a task, in characters.
# max_brief_chars = 20000

[runtime]
# Where thread records, topic prompts and task briefs are written (mode 600).
# dir = "~/.local/state/vega"
