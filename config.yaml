# Hermes config for Vega's profile. Installed by `hermes profile install`;
# `hermes profile update vega` keeps your local edits unless --force-config.
#
# Not here on purpose: the model provider (run `hermes -p vega model`), Slack
# tokens (the profile's .env), and every Slack id or path (vega.toml beside this file).

plugins:
  # The vega plugin: allowlist gate, the origin tools, the heartbeat news check.
  enabled:
    - vega

# Vega's model runs fleet's intake for its Slack thread through Vega's own
# tools and nothing else: no terminal, no files, no web. Every fleet command
# is a fixed argv built by the plugin, with the origin set by code. The skills
# toolset is there so skills reach the model at all (Hermes injects none
# without it); the vega plugin refuses its one write tool, skill_manage.
platform_toolsets:
  slack: [vega, skills]
  cli: [vega, skills]

skills:
  # Loaded in full into every session. intake-guidelines is the operator's own
  # skill (~/.hermes/profiles/vega/skills/intake-guidelines/SKILL.md): which
  # repository, branch, agent and publish method fit which request. Vega ships
  # none of that; until it exists Hermes logs it as missing and skips it.
  auto_load: [fleet-origin, intake-guidelines]

slack:
  # Channels: answer only when @mentioned; replies in an existing thread need none.
  require_mention: true
  # Vega's plugin refuses strangers itself (SLACK_ALLOW_ALL_USERS=true in .env lets
  # them reach it); Hermes' own pairing flow stays off.
  unauthorized_dm_behavior: ignore
  # Other bots never reach Vega.
  allow_bots: none

platforms:
  slack:
    reply_to_mode: first
    extra:
      # Every reply goes in the thread of the message it answers. The thread is
      # the fleet origin, so its news lands there too.
      reply_in_thread: true
      reply_broadcast: false
      unfurl_links: false
      unfurl_media: false

approvals:
  # Vega has no terminal tool; anything that would still ask for approval is refused.
  mode: manual
